# Ugentlig scanning efter nye kilder og modelnavne. Kan også startes manuelt under Actions.
name: scan
on:
  schedule: [{ cron: '0 5 * * 1' }]
  workflow_dispatch:
permissions: { contents: write, issues: write }
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: scan
        run: node scan/scan.js
        env: { WAYBACK: '1' }
      - name: Commit
        run: |
          git config user.name 'ph-scan'
          git config user.email 'ph-scan@users.noreply.github.com'
          git add data/found.js scan/names.json scan/seen.txt scan/report.md
          git diff --cached --quiet || { git commit -m "Scanning $(date -u +%F)"; git push; }
      - name: Issue med nye fund
        if: steps.scan.outputs.new != '0'
        run: gh issue create --title "Nye fund $(date -u +%F)" --body-file scan/report.md
        env: { GH_TOKEN: '${{ github.token }}' }
